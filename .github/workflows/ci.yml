name: ci

# The qualification record.
#
# Before this existed the suite was real but manual: 617 backend tests, a
# typecheck and a production build that only ran when someone remembered to
# type the command. "Qualified through test and demonstration" is not a claim
# you can make about tests that ran by hand on one laptop, so this makes every
# push answer for itself.
#
#   backend    jest — the full suite (spawns a real server on a free port
#              against mongodb-memory-server; needs no external database). The
#              count is a measurement, not a memory: this job writes
#              docs/evidence/test-count.json, and scripts/evidence.cjs --check
#              then fails the build if any doc states a different number.
#   web        tsc --noEmit + vite build (typecheck became a real gate when
#              typescript was installed; before that it silently did nothing)
#   calculator python -m unittest — stdlib only, so no pytest dependency is
#              smuggled into the deployed service
#   gate       the project's own fast preflight, so the repo's contract is
#              asserted by the repo's own tool
#
# The live/deployed tiers deliberately do NOT run here (no server is listening
# on a runner) — those are covered by deployed-smoke.yml against the real URL.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (jest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # mongodb-memory-server downloads a MongoDB binary on first use (~100 MB);
      # caching it keeps CI honest without making it slow.
      - name: Cache the in-memory MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongo-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: mongo-binaries-${{ runner.os }}-

      - name: Install
        run: npm ci

      - name: Test
        run: npx jest --runInBand --json --outputFile=../docs/evidence/test-count.raw.json

      # The docs quote this number. Recording it here is what makes
      # `evidence.cjs --check` (below) able to catch a stale claim instead of a
      # reviewer having to notice one.
      - name: Record the test count
        run: node ../scripts/evidence.cjs --record-tests ../docs/evidence/test-count.raw.json

      - name: Docs must agree with the artifacts
        run: node ../scripts/evidence.cjs --check

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-backend
          path: |
            docs/evidence/test-count.json
            docs/evidence/facts.json
          if-no-files-found: warn

  web:
    name: web (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Record bundle size
        run: |
          total=$(du -sh dist | cut -f1)
          echo "production build: $total"
          {
            echo "### web build"
            echo ""
            echo "| check | result |"
            echo "|---|---|"
            echo "| typecheck | clean |"
            echo "| build | $total |"
          } >> "$GITHUB_STEP_SUMMARY"

  calculator:
    name: calculator (unittest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install service deps
        run: pip install -r requirements-calc.txt

      - name: Test
        run: python -m unittest test_net_realization -v

  gate:
    name: gate (preflight --fast)
    needs: [backend, web, calculator]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # preflight inspects the source tree and runs the web typecheck, so both
      # dependency sets must be present.
      - name: Install deps
        run: |
          npm ci --prefix backend
          npm ci --prefix web-app

      - name: Run the project's own fast gate
        run: node scripts/preflight.cjs --fast

      - name: Docs must agree with the artifacts
        run: node scripts/evidence.cjs --check

      - name: Summarise
        run: |
          {
            echo "### ci — all green"
            echo ""
            echo "backend jest · web typecheck + build · calculator unittest · preflight --fast · evidence --check"
          } >> "$GITHUB_STEP_SUMMARY"
