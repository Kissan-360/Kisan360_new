<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kisan360 — Offline</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f0fdf4; color: #1a2e22; padding: 24px; text-align: center; }
    .card { max-width: 420px; background: #fff; border: 1px solid #bbf7d0; border-radius: 16px; padding: 24px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.5; color: #444; }
    button { margin-top: 12px; padding: 10px 16px; border-radius: 10px; border: 0; background: #006b2c; color: #fff; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're offline — Kisan360</h1>
    <p>Your last chat and decision are saved on this device. Messages you queued will send automatically when signal returns. Your market snapshot is still visible in Decision Workspace.</p>
    <button onclick="location.reload()">Retry now</button>
  </div>
</body>
</html>
